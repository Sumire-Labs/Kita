bot:
  token: "${DISCORD_TOKEN}"
  shards: 0 # 0 = Discordの推奨値で自動シャーディング
  developmentGuildId: 0 # 開発サーバーIDを指定するとコマンドをそのサーバーだけに登録
database:
  url: "${JDBC_URL:-jdbc:mariadb://database:3306/kita}"
  user: kita
  password: "${MARIADB_PASSWORD}"
deepl:
  key: "${DEEPL_KEY:-}"
  maxCharacters: 3000
  flagLanguages: {} # 例: HK: ZH-HANT, CA: FR
music:
  enabled: true
  uri: "${LAVALINK_URI:-http://lavalink:2333}"
  password: "${LAVALINK_PASSWORD}"
  presetsDirectory: "${PRESETS_DIRECTORY:-presets}"
  defaultPreset: "Aura_Halo_2.0.wav" # WAVの相対ファイル名。未配置なら無効、offで明示的に無効化
previews:
  ytDlp: "${YT_DLP:-yt-dlp}"
dataDirectory: "${DATA_DIRECTORY:-data}"
